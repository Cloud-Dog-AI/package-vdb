performance_baselines:
  metrics:
    - parse_latency_p50_ms
    - parse_latency_p95_ms
    - throughput_pages_per_second
    - ocr_auto_trigger_ratio
    - quality_invariant_pass_rate

  thresholds:
    minimum_quality_invariant_pass_rate: 0.95
    max_failure_ratio_per_provider: 0.05

providers:
  parser:
    - internal
    - mineru
    - deepdoc
    - docling
    - marker_mcp
    - transformers
  ocr:
    - local
    - external_service
    - llm_ocr
  embedding:
    - configured_via_cloud_dog_config
